services:
  - type: web
    name: expense-tracker-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_PATH
        value: /opt/render/project/data/expenses.db
      - key: ALLOWED_ORIGINS
        sync: false
    disk:
      name: expense-data
      mountPath: /opt/render/project/data
      sizeGB: 1
